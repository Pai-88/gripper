# Robot configuration — the single source of truth for joint limits, geometry,
# serial link, vision and safety. Loaded and validated by gripper/config.py.
# tools/gen_firmware_limits.py regenerates firmware/esp32_servo/limits.h from
# the `joints` block so the Pi and the MCU can never disagree on limits.
#
# Angles are DEGREES. Calibrated per-user offsets live separately in
# config/calibration.yaml (machine-generated by tools/calibrate.py).

serial:
  port: /dev/ttyACM0      # ESP32 native USB CDC
  baud: 1000000
  command_hz: 50          # Pi -> ESP32 target stream rate
  telemetry_hz: 20

# Four commanded DOF + grip. `servo_id` is the LX bus-servo ID on the chain.
# servo_pos_min / servo_pos_max are LX position units (0..1000 over 0..240 deg)
# at this joint's min_deg / max_deg. These are CALIBRATION values — measure them
# on the bench (jog each joint to its limits and read SERVO_POS_READ) and set them
# here. If omitted, gen_firmware_limits.py picks a centred default from the span.
# If a joint drives the wrong way, swap servo_pos_min/max (or flip `invert`).
joints:
  base:     { servo_id: 6, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_rate_dps: 120, invert: false, servo_pos_min: 125, servo_pos_max: 875 }
  shoulder: { servo_id: 5, min_deg: 0,    max_deg: 90,  home_deg: 20,  max_rate_dps: 90,  invert: false, servo_pos_min: 312, servo_pos_max: 688 }
  elbow:    { servo_id: 4, min_deg: -120, max_deg: 0,   home_deg: -60, max_rate_dps: 120, invert: false, servo_pos_min: 250, servo_pos_max: 750 }
  wrist:    { servo_id: 3, min_deg: -90,  max_deg: 90,  home_deg: 0,   max_rate_dps: 150, invert: false, servo_pos_min: 125, servo_pos_max: 875 }
  # grip: servo_pos_min = jaws CLOSED, servo_pos_max = jaws OPEN.
  grip:     { servo_id: 1, min_deg: 0,    max_deg: 100, home_deg: 100, max_rate_dps: 300, invert: false, servo_pos_min: 291, servo_pos_max: 709 }

# The xArm 1S has a redundant 5th arm joint (servo_id 2) that is locked and
# folded into the shoulder command — not commanded directly.
locked_servo_id: 2

geometry:
  l1_m: 0.120            # shoulder -> elbow link
  l2_m: 0.100            # elbow -> wrist link

cameras:
  teleop:  { index: 0, width: 640, height: 480, fps: 30 }   # USB webcam, watches the hand
  wrist:   { index: 1, width: 640, height: 480, fps: 30 }   # eye-in-hand (CSI / endoscope)

teleop:
  model_path: models/gesture_recognizer.task   # python tools/download_models.py
  mirror: true                                  # selfie view (hand-left -> arm-left)
  one_euro: { freq: 30.0, mincutoff: 1.0, beta: 0.007, dcutoff: 1.0 }
  gesture:  { hold_frames: 12, min_score: 0.7 }

watchdog:
  mcu_timeout_ms: 200     # ESP32 fails safe if no valid J frame within this
  vision_stale_ms: 300    # Pi forces ESTOP if the active camera feed goes stale

grasp:
  model: models/yolo11n_objects.onnx
  detect_hz: 8            # throttled detection; servoing loop runs faster
  servo_gain_x: 0.4
  servo_gain_scale: 0.6
  commit_frames: 5        # frames within tolerance before plunge
